<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Método Raíz — Isabel Quiñonez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF1EA;
  --paper-2:#F3E1D1;
  --ink:#3A2419;
  --ink-soft:#836A5B;
  --green-deep:#3D130C;
  --green:#651F14;
  --green-soft:#DDAE9B;
  --sage:#EAC9BA;
  --clay:#84AC3B;
  --clay-soft:#B8D97F;
  --gold:#D9A24B;
  --line:#E9D9C9;
  --card:#FFFBF6;
  --shadow: 0 1px 2px rgba(61,19,12,.06), 0 6px 20px rgba(61,19,12,.07);
  --radius: 18px;
  --serif: "Fredoka", "Karla", sans-serif;
  --sans: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;}
button{font-family:inherit;}

::selection{background:var(--clay-soft);color:#fff;}

/* ---------- Layout shell ---------- */
.app{
  display:grid;
  grid-template-columns: 272px 1fr;
  min-height:100vh;
}
@media (max-width: 900px){
  .app{grid-template-columns:1fr;}
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--green-deep);
  color:#EFEAD8;
  padding:28px 22px 24px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:26px;
}
@media (max-width:900px){
  .sidebar{position:relative;height:auto;}
}
.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand-mark{
  font-family:var(--serif);
  font-weight:600;
  font-size:1.5rem;
  letter-spacing:.01em;
  color:#fff;
}
.brand-logo{
  width:100%;
  max-width:190px;
  height:auto;
  border-radius:10px;
  background:#fff;
  padding:8px 10px;
}
.brand-sub{
  font-size:.72rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--sage);
}
.nav-top{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.nav-link{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border-radius:10px;
  color:#D9D4C0;
  text-decoration:none;
  font-size:.92rem;
  cursor:pointer;
  border:none;
  background:none;
  text-align:left;
  width:100%;
}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-link.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;}

/* root path */
.root-path{
  position:relative;
  padding-left:26px;
  display:flex;
  flex-direction:column;
  gap:2px;
  flex:1;
}
.root-path svg.spine{
  position:absolute;
  left:0; top:6px; bottom:6px;
  width:26px;
  height:calc(100% - 12px);
}
.stage-node{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 8px 11px 4px;
  cursor:pointer;
  border-radius:10px;
  background:none;
  border:none;
  color:#D9D4C0;
  text-align:left;
  width:100%;
}
.stage-node:hover{background:rgba(255,255,255,.06);}
.stage-node.active{background:rgba(255,255,255,.11);}
.node-dot{
  width:15px;height:15px;
  border-radius:50%;
  border:2px solid var(--sage);
  background:var(--green-deep);
  flex:none;
  position:relative;
  z-index:2;
  transition:background .3s, border-color .3s;
}
.node-dot.done{background:var(--gold);border-color:var(--gold);}
.node-dot.partial{background:var(--green-soft);border-color:var(--sage);}
.node-label{
  display:flex;
  flex-direction:column;
  gap:1px;
}
.node-letter{
  font-family:var(--serif);
  font-size:.68rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--sage);
}
.node-title{
  font-size:.86rem;
  color:#EFEAD8;
}
.stage-node.active .node-title{color:#fff;font-weight:600;}

.sidebar-foot{
  font-size:.72rem;
  color:var(--sage);
  border-top:1px solid rgba(255,255,255,.12);
  padding-top:14px;
  line-height:1.5;
}

/* mobile top bar */
.mobile-bar{display:none;}
@media (max-width:900px){
  .mobile-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--green-deep); color:#fff;
    position:sticky; top:0; z-index:30;
  }
  .mobile-bar .brand-mark{font-size:1.15rem;}
  .menu-btn{
    background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:8px; padding:6px 10px; font-size:.85rem;
  }
  .sidebar{display:none;}
  .sidebar.open{display:flex;}
}

/* ---------- Main ---------- */
main{
  padding: 44px 56px 90px;
  max-width: 900px;
}
@media (max-width:900px){
  main{padding:28px 20px 70px;}
}

.view{display:none;animation:fade .35s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{
  font-size:.74rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--clay);
  font-weight:700;
  margin-bottom:10px;
  display:flex; align-items:center; gap:8px;
}
h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:2.5rem;
  line-height:1.08;
  margin:0 0 18px;
  color:var(--green-deep);
  letter-spacing:-.01em;
}
h2{
  font-family:var(--serif);
  font-weight:600;
  font-size:1.55rem;
  color:var(--green-deep);
  margin:40px 0 14px;
}
h3{
  font-family:var(--serif);
  font-weight:600;
  font-size:1.18rem;
  color:var(--green);
  margin:26px 0 10px;
}
p{margin:0 0 14px;color:var(--ink-soft);}
.lede{
  font-family:var(--sans);
  font-style:italic;
  font-weight:600;
  font-size:1.2rem;
  color:var(--ink);
  line-height:1.5;
  margin-bottom:26px;
}

.callout{
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--green-soft);
  border-radius:12px;
  padding:18px 20px;
  margin:20px 0;
  color:var(--ink-soft);
  font-size:.96rem;
}
.callout.gold{border-left-color:var(--gold);}
.callout.clay{border-left-color:var(--clay);}
.callout strong{color:var(--ink);}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px 28px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){.grid-2{grid-template-columns:1fr;}}

/* buttons/links */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 20px;
  border-radius:999px;
  background:var(--green);
  color:#fff !important;
  text-decoration:none;
  font-weight:600;
  font-size:.9rem;
  border:none;
  cursor:pointer;
  transition:transform .15s, background .15s;
}
.btn:hover{background:var(--green-deep);transform:translateY(-1px);}
.btn.clay{background:var(--clay);}
.btn.clay:hover{background:#6B8F2E;}
.btn.ghost{
  background:transparent;color:var(--green) !important;
  border:1.5px solid var(--green-soft);
}
.btn.ghost:hover{background:rgba(101,31,20,.07);}

/* Progress bar */
.progress-wrap{
  display:flex; align-items:center; gap:12px;
  margin:6px 0 30px;
}
.progress-track{
  flex:1; height:8px; background:var(--paper-2);
  border-radius:6px; overflow:hidden; border:1px solid var(--line);
}
.progress-fill{
  height:100%; background:linear-gradient(90deg, var(--green-soft), var(--gold));
  border-radius:6px; transition:width .4s ease;
  width:0%;
}
.progress-pct{font-size:.82rem;color:var(--ink-soft);font-weight:600;min-width:38px;text-align:right;}

/* Stage path overview cards */
.stage-cards{display:flex;flex-direction:column;gap:14px;}
.stage-card{
  display:grid; grid-template-columns:56px 1fr auto;
  align-items:center; gap:18px;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 20px; cursor:pointer; text-decoration:none; color:inherit;
  box-shadow:var(--shadow);
  transition:transform .15s, border-color .15s;
}
.stage-card:hover{transform:translateX(3px); border-color:var(--green-soft);}
.stage-icon{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  background:var(--paper-2);
  border:2px solid var(--sage);
}
.stage-card.done .stage-icon{background:var(--gold);border-color:var(--gold);}
.stage-card-title{font-family:var(--serif);font-weight:600;font-size:1.1rem;color:var(--green-deep);}
.stage-card-sub{font-size:.85rem;color:var(--ink-soft);margin-top:2px;}
.stage-card-pct{font-size:.85rem;font-weight:700;color:var(--green);}

/* Checklist */
.checklist{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:9px;}
.opt-item{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;color:var(--ink);}
.opt-item input[type=checkbox]{
  appearance:none; -webkit-appearance:none;
  width:19px;height:19px;flex:none;margin-top:1px;
  border:2px solid var(--green-soft); border-radius:6px;
  cursor:pointer; position:relative; background:#fff;
}
.opt-item input[type=checkbox]:checked{background:var(--green);border-color:var(--green);}
.opt-item input[type=checkbox]:checked::after{
  content:"✓"; position:absolute; top:-3px; left:2px; color:#fff; font-size:13px; font-weight:700;
}
.opt-item label{cursor:pointer;}

.task-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px; border-radius:10px; background:var(--paper-2);
  font-size:.94rem; font-weight:500;
}
.task-item input[type=checkbox]{
  appearance:none; -webkit-appearance:none;
  width:20px;height:20px;flex:none;margin-top:1px;
  border:2px solid var(--clay); border-radius:50%;
  cursor:pointer; position:relative; background:#fff;
}
.task-item input[type=checkbox]:checked{background:var(--clay);border-color:var(--clay);}
.task-item input[type=checkbox]:checked::after{
  content:"✓"; position:absolute; top:-2px; left:3px; color:#fff; font-size:12px; font-weight:700;
}
.task-item.checked label{text-decoration:line-through;color:var(--ink-soft);opacity:.75;}

/* Reflection */
.reflect{margin:16px 0 22px;}
.reflect label{
  display:block; font-weight:600; color:var(--ink); margin-bottom:8px; font-size:.95rem;
}
.reflect .hint{font-weight:400;color:var(--ink-soft);font-size:.85rem;display:block;margin-top:2px;}
.reflect textarea{
  width:100%; min-height:76px; resize:vertical;
  border:1.5px solid var(--line); border-radius:12px;
  padding:12px 14px; font-family:var(--sans); font-size:.95rem;
  background:#fff; color:var(--ink);
}
.reflect textarea:focus{outline:none;border-color:var(--green-soft);}
.save-hint{font-size:.76rem;color:var(--sage-text,#7C8A72);opacity:0;transition:opacity .3s;}
.save-hint.show{opacity:1;}

/* Activity block */
.activity{
  border-top:1px solid var(--line);
  padding-top:26px; margin-top:26px;
}
.activity:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.activity-title{
  font-family:var(--serif); font-weight:600; font-size:1.28rem; color:var(--green-deep);
  margin-bottom:6px;
}
.sub-cat{
  font-family:var(--sans); font-style:italic; font-weight:700; color:var(--green); font-size:1rem;
  margin:18px 0 8px;
}

/* Resource list */
.res-item{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; padding:12px 0; border-bottom:1px dashed var(--line);
}
.res-item:last-child{border-bottom:none;}
.res-title{font-weight:600;font-size:.94rem;}
.res-note{font-size:.83rem;color:var(--ink-soft);margin-top:2px;}

/* footer nav within stage */
.stage-footnav{
  display:flex; justify-content:space-between; margin-top:44px; gap:12px;
}

/* misc */
.tag{
  display:inline-block; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
  background:var(--paper-2); color:var(--green); border-radius:999px; padding:4px 10px; font-weight:700;
  margin-bottom:14px;
}
.person{
  display:flex; gap:18px; align-items:center; margin:26px 0;
}
.person img{
  width:88px;height:88px;border-radius:50%;object-fit:cover;
  border:3px solid var(--paper-2);
}
.check-line{font-size:.9rem;color:var(--ink-soft);display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
.check-line::before{content:"✓";color:var(--green);font-weight:700;}

hr.rule{border:none;border-top:1px solid var(--line);margin:34px 0;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;}
.chip{
  background:var(--paper-2); border-radius:999px; padding:6px 13px;
  font-size:.82rem; color:var(--ink);
}

.affirm{
  font-family:var(--sans); font-style:italic; font-weight:700; font-size:1.1rem;
  color:var(--green-deep); text-align:center; padding:22px;
  background:var(--card); border-radius:16px; border:1px solid var(--line);
  margin:24px 0;
}

@media print{
  .sidebar,.mobile-bar,.stage-footnav{display:none !important;}
}

.export-btn{
  width:100%; justify-content:center; margin-bottom:6px; font-size:.82rem; padding:10px 14px;
  color:#F3E1D1 !important; border-color:rgba(243,225,209,.4);
}
.export-btn:hover{background:rgba(255,255,255,.08);}

.save-toast{
  position:fixed; bottom:22px; right:22px;
  background:var(--green-deep); color:#fff;
  padding:10px 18px; border-radius:999px;
  font-size:.85rem; font-weight:600;
  box-shadow:var(--shadow);
  opacity:0; transform:translateY(8px);
  transition:opacity .25s, transform .25s;
  pointer-events:none;
  z-index:50;
}
.save-toast.show{opacity:1; transform:translateY(0);}
</style>
</head>

function nid(){ return "k" + (UID++); }

function task(stage, text, checked, key){
  const id = `task-${stage}-${key || nid()}`;
  return `<div class="task-item" data-task-wrap>
    <input type="checkbox" id="${id}" data-store="${id}" data-task data-stage="${stage}" ${checked?"checked":""}/>
    <label for="${id}">${text}</label>
  </div>`;
}
function checklist(stage, items, key){
  return `<ul class="checklist">${items.map((t,i)=>{
    const id = `opt-${stage}-${key ? key+"-"+i : nid()}`;
    return `<li class="opt-item"><input type="checkbox" id="${id}" data-store="${id}"/><label for="${id}">${t}</label></li>`;
  }).join("")}</ul>`;
}
function reflect(stage, label, hint, rows, key){
  const id = `ref-${stage}-${key || nid()}`;
  return `<div class="reflect">
    <label for="${id}">${label}${hint?`<span class="hint">${hint}</span>`:""}</label>
    <textarea id="${id}" data-store="${id}" data-label="${label.replace(/"/g,'&quot;')}" rows="${rows||3}" placeholder="Escribe aquí con calma, sin buscar la respuesta perfecta..."></textarea>
  </div>`;
}
function subcat(t){ return `<div class="sub-cat">${t}</div>`; }
function h3(t){ return `<h3>${t}</h3>`; }
function p(t){ return `<p>${t}</p>`; }
function callout(t, cls){ return `<div class="callout ${cls||""}">${t}</div>`; }

/* ---------------- Render de una etapa completa ---------------- */
function renderStage(stage){
  let html = "";
  html += `<div class="tag">Etapa ${stage.id} · ${stage.letter} — ${stage.name}</div>`;
  html += `<h1>${stage.icon} ${stage.session}</h1>`;
  html += `<p class="lede">${stage.goal}</p>`;

  html += `<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="stagebar-${stage.id}"></div></div><div class="progress-pct" id="stagepct-${stage.id}">0%</div></div>`;

  html += `<div class="card">`;
  html += `<h3 style="margin-top:0">🎯 Objetivo</h3><p>${stage.objetivo}</p>`;
  html += `<h3>Lo que aprenderás</h3><div class="chip-row">${stage.aprenderas.map(a=>`<span class="chip">${a}</span>`).join("")}</div>`;
  html += `</div>`;

  if(stage.tareasPrevias){
    html += `<div class="callout"><strong>Clases de esta sesión:</strong><br>` + stage.tareasPrevias.join("<br>") + `</div>`;
  }

  stage.activities.forEach((act, i)=>{
    html += `<div class="activity">`;
    html += `<div class="activity-title">📋 ${act.title}</div>`;
    html += act.body;
    html += `</div>`;
  });

  if(stage.extra){
    html += `<div class="activity"><div class="activity-title">${stage.extra.title}</div>${stage.extra.body}</div>`;
  }
  if(stage.checklistFinal){
    html += `<div class="activity"><div class="activity-title">${stage.checklistFinal.title}</div><p>${stage.checklistFinal.intro}</p>`;
    stage.checklistFinal.groups.forEach((g,gi)=>{
      html += subcat(g.name) + checklist(stage.id, g.items, `final-g${gi}`);
    });
    html += reflect(stage.id,"Lo que más he fortalecido durante este proceso es:",null,3,"final-r0")
          + reflect(stage.id,"Lo que quiero seguir trabajando es:",null,3,"final-r1")
          + reflect(stage.id,"Una promesa que me hago a mí misma es:",null,3,"final-r2");
    html += `</div>`;
  }

  if(stage.reflexionExtra){
    html += `<div class="callout gold"><strong>🌱 Antes de continuar, pregúntate:</strong><br>` + stage.reflexionExtra.map(q=>`📝 ${q}`).join("<br>") + `</div>`;
  }

  if(stage.recursos){
    html += `<h2>📚 Recursos complementarios</h2><p>Estos recursos son opcionales — no es necesario completarlos para avanzar en el programa.</p>`;
    html += `<div class="card">`;
    if(stage.recursos.lectura){
      html += `<h3 style="margin-top:0">📖 Lectura recomendada</h3><p><strong>${stage.recursos.lectura.titulo}</strong><br>${stage.recursos.lectura.nota}</p>`;
      html += `<div class="checklist">` + stage.recursos.lectura.preguntas.map(q=>`<div class="check-line">${q}</div>`).join("") + `</div>`;
    }
    if(stage.recursos.lecturas){
      html += `<h3 style="margin-top:0">📖 Lecturas recomendadas</h3>`;
      stage.recursos.lecturas.forEach(l=>{
        html += `<div class="res-item"><div><div class="res-title">${l.titulo}</div><div class="res-note">${l.nota}</div></div></div>`;
      });
    }
    if(stage.recursos.videos){
      html += `<h3>🎥 Videos recomendados</h3>`;
      stage.recursos.videos.forEach(v=>{
        html += `<div class="res-item"><div class="res-title">${v.titulo}</div>${linkBtn("Ver", v.url, "ghost")}</div>`;
      });
    }
    if(stage.recursos.audio){
      html += `<h3>🎧 Audio de apoyo</h3><p>${stage.recursos.audio}</p>`;
    }
    if(stage.recursos.reflexionOpcional){
      html += `<h3>💭 Reflexión opcional</h3>`;
      html += reflect(stage.id, "Después de leer, ver o escuchar el material, ¿qué descubriste?", stage.recursos.reflexionOpcional.join(" · "), 4, "res-opt");
    }
    html += `</div>`;
  }

  if(stage.antesDeAvanzar){
    html += `<h2>📌 Antes de avanzar</h2><div class="card">`;
    stage.antesDeAvanzar.forEach((t,i)=> html += task(stage.id, t, false, `pre-${i}`));
    html += `</div>`;
  }

  html += `<div class="affirm">🌱 ${stage.resultado}</div>`;

  const prev = STAGES.find(s=>s.id===stage.id-1);
  const next = STAGES.find(s=>s.id===stage.id+1);
  html += `<div class="stage-footnav">`;
  html += prev ? `<button class="btn ghost" onclick="go('etapa-${prev.id}')">← ${prev.name}</button>` : `<span></span>`;
  html += next ? `<button class="btn" onclick="go('etapa-${next.id}')">${next.name} →</button>` : `<button class="btn" onclick="go('biblioteca')">Ir a la Biblioteca Raíz →</button>`;
  html += `</div>`;

  return html;
}

/* ---------------- Exportar respuestas ---------------- */
const ANSWER_LABELS = {};
function harvestLabels(){
  const scratch = document.createElement("div");
  STAGES.forEach(s=>{
    scratch.innerHTML = renderStage(s);
    scratch.querySelectorAll("textarea[data-store]").forEach(t=>{
      ANSWER_LABELS[t.dataset.store] = { label: t.dataset.label || "", stage: s.id, stageName: s.name, session: s.session };
    });
  });
}

function exportAnswers(){
  const fecha = new Date().toLocaleDateString("es-CO", {year:"numeric", month:"long", day:"numeric"});
  let out = "MÉTODO RAÍZ — Mis respuestas\nIsabel Quiñonez · Concientisa\nExportado el " + fecha + "\n" + "=".repeat(60) + "\n\n";
  let any = false;

  STAGES.forEach(s=>{
    let stageOut = "";
    Object.keys(ANSWER_LABELS).forEach(id=>{
      const meta = ANSWER_LABELS[id];
      if(meta.stage !== s.id) return;
      const val = localStorage.getItem("raiz_" + id);
      if(val && val.trim()){
        stageOut += `— ${meta.label}\n${val.trim()}\n\n`;
        any = true;
      }
    });
    if(stageOut){
      out += `ETAPA ${s.id} · ${s.name.toUpperCase()} — ${s.session}\n${"-".repeat(50)}\n${stageOut}\n`;
    }
  });

  if(!any){
    out += "Todavía no has completado ninguna reflexión escrita.\n";
  }

  const blob = new Blob([out], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mis-respuestas-metodo-raiz.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  flashSaved();
}

function go(route){

  const main = document.getElementById("main");
  main.innerHTML = `<div class="view active">${routes[route]()}</div>`;
  main.querySelector('.view').innerHTML = main.querySelector('.view').innerHTML.replace("__PHOTO__", window.__RAIZ_PHOTO__ || "");

  updateNavActive(route);
  hydrateStorage();
  updateAllProgress();
  window.location.hash = route;
  document.getElementById("sidebar").classList.remove("open");
}

/* ---------------- Toast de guardado ---------------- */
let toastTimer;
function flashSaved(){
  const toast = document.getElementById("saveToast");
  if(!toast) return;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove("show"), 1600);
}

/* ---------------- Persistencia ---------------- */
function hydrateStorage(){
  document.querySelectorAll("[data-store]").forEach(el=>{
    const key = "raiz_" + el.dataset.store;
    const saved = localStorage.getItem(key);
    if(el.type === "checkbox"){
      el.checked = saved === "1";
      if(el.dataset.task){
        el.closest(".task-item").classList.toggle("checked", el.checked);
      }
      el.addEventListener("change", ()=>{
        localStorage.setItem(key, el.checked ? "1" : "0");
        if(el.dataset.task){
          el.closest(".task-item").classList.toggle("checked", el.checked);
        }
        updateAllProgress();
        flashSaved();
      });
    } else {
      if(saved) el.value = saved;
      let t;
      el.addEventListener("input", ()=>{
        clearTimeout(t);
        t = setTimeout(()=> { localStorage.setItem(key, el.value); flashSaved(); }, 500);
      });
    }
  });
}

/* ---------------- Progreso ---------------- */
function stageProgress(stageId){
  const boxes = Array.from(document.querySelectorAll(`[data-task][data-stage="${stageId}"]`));
  if(!boxes.length) return computeStageProgressGlobal(stageId);
  const total = boxes.length, done = boxes.filter(b=>b.checked).length;
  return total ? Math.round(done/total*100) : 0;
}
// compute progress for a stage even when we're not currently viewing it (scan localStorage keys)
function computeStageProgressGlobal(stageId){
  let total=0, done=0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(`raiz_task-${stageId}-`)){
      total++;
      if(localStorage.getItem(k)==="1") done++;
    }
  }
  return total ? Math.round(done/total*100) : 0;
}

function updateAllProgress(){
  let overallTotal=0, overallDone=0;
  STAGES.forEach(s=>{
    const pct = document.querySelector(`[data-task][data-stage="${s.id}"]`) ? stageProgress(s.id) : computeStageProgressGlobal(s.id);
    // sidebar node
    const dot = document.querySelector(`.stage-node[data-route="etapa-${s.id}"] .node-dot`);
    if(dot){
      dot.classList.toggle("done", pct===100);
      dot.classList.toggle("partial", pct>0 && pct<100);
    }
    // page-level bar (if present)
    const bar = document.getElementById(`stagebar-${s.id}`);
    const pctEl = document.getElementById(`stagepct-${s.id}`);
    if(bar){ bar.style.width = pct + "%"; }
    if(pctEl){ pctEl.textContent = pct + "%"; }
    const homePct = document.getElementById(`home-pct-${s.id}`);
    if(homePct) homePct.textContent = pct + "%";
    const caminoPct = document.getElementById(`camino-pct-${s.id}`);
    if(caminoPct) caminoPct.textContent = pct + "%";

    // count totals from storage for overall bar
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(`raiz_task-${s.id}-`)){
        overallTotal++;
        if(localStorage.getItem(k)==="1") overallDone++;
      }
    }
  });
  const totalPct = overallTotal ? Math.round(overallDone/overallTotal*100) : 0;
  const totalBar = document.getElementById("totalbar");
  const totalPctEl = document.getElementById("totalpct");
  if(totalBar) totalBar.style.width = totalPct + "%";
  if(totalPctEl) totalPctEl.textContent = totalPct + "%";
}
